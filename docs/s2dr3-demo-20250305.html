
<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <title>S2DR3 Demo</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v2.10.0/mapbox-gl.js'></script>
    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v2.10.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        body { margin:0; padding:0; background: #111!important; }
    </style>
</head>
<body>

<style>
    body {
        overflow: hidden;
    }

    body * {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }

    .map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
    }
	
	.mapbox-attribution-container {
		bottom: 0;
		right: 0;
		position: absolute;
		display: block;
		margin: 0;
		padding: 0 5px;
		font-family: 'Helvetica Neue', Arial, Helvetica, sans-serif;
		font-size: 12px;
		line-height: 20px;
		font-weight: normal;
		-webkit-tap-highlight-color: rgba(0,0,0,0);
		background-color: rgba(255, 255, 255, 0.5);
		color: rgba(0, 0, 0, 0.75);
	}
	
	.menu {
		background: #fff;
		position: absolute;
		z-index: 1;
		top: 10px;
		border-radius: 3px;
		width: 120px;
		border: 1px solid rgba(0, 0, 0, 0.4);
		font-family: 'Open Sans', sans-serif;
	}
	
	#menu {
		left: 10px;
	}
	
	#menuR {
		right: 10px;
	}
 
	.menu a {
		font-size: 13px;
		color: #404040;
		display: block;
		margin: 0;
		padding: 0;
		padding: 10px;
		text-decoration: none;
		border-bottom: 1px solid rgba(0, 0, 0, 0.25);
		text-align: center;
	}
 
	.menu a:last-child {
		border: none;
	}
 
	.menu a:hover {
		background-color: #f8f8f8;
		color: #404040;
	}
 
	.menu a.active {
		background-color: #3887be;
		color: #ffffff;
	}
 
	.menu a.active:hover {
		background: #3074a4;
	}

	/* Shown while either side is still fetching tiles */
	#loader {
		position: absolute;
		z-index: 1;
		top: 10px;
		left: 50%;
		transform: translateX(-50%);
		display: flex;
		align-items: center;
		gap: 8px;
		padding: 7px 12px;
		border-radius: 3px;
		background: rgba(17, 17, 17, 0.8);
		color: #fff;
		font-family: 'Open Sans', sans-serif;
		font-size: 13px;
		line-height: 17px;
		white-space: nowrap;
		pointer-events: none;
		opacity: 0;
		transition: opacity 0.15s;
	}

	/* The delay stops it flashing when tiles come straight from the cache */
	#loader.visible {
		opacity: 1;
		transition: opacity 0.15s 0.2s;
	}

	#loader::before {
		content: '';
		width: 14px;
		height: 14px;
		border: 2px solid rgba(255, 255, 255, 0.3);
		border-top-color: #fff;
		border-radius: 50%;
		animation: loader-spin 0.8s linear infinite;
	}

	@keyframes loader-spin {
		to { transform: rotate(360deg); }
	}

	/* Bottom-right footer: cursor coordinates next to the attribution */
	#footer {
		position: absolute;
		z-index: 2;
		right: 0;
		bottom: 0;
		display: flex;
	}

	#footer .mapbox-attribution-container {
		position: static;
	}

	#coords {
		margin: 0;
		padding: 0 8px;
		font-family: 'Helvetica Neue', Arial, Helvetica, sans-serif;
		font-size: 12px;
		line-height: 20px;
		font-variant-numeric: tabular-nums;
		white-space: nowrap;
		background-color: rgba(255, 255, 255, 0.5);
		color: rgba(0, 0, 0, 0.75);
		border-right: 1px solid rgba(0, 0, 0, 0.2);
	}

	#coords:empty {
		display: none;
	}

	#coords.copied {
		background-color: #3887be;
		color: #fff;
	}

</style>

<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-compare/v0.4.0/mapbox-gl-compare.js"></script>
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-compare/v0.4.0/mapbox-gl-compare.css" type="text/css"/>

<nav id="menu" class="menu"></nav>
<nav id="menuR" class="menu"></nav>
<div id="comparison-container">
    <div id="before" class="map"></div>
    <div id="after" class="map"></div>
</div>
<div id="footer">
    <div id="coords" title="Right-click on the map to copy the coordinates"></div>
    <div id="attribution" class="mapbox-attribution-container"></div>
</div>
<div id="loader" role="status" aria-live="polite">Loading imagery…</div>

<!--<script src='s2dr2datasets11.js'></script>-->
<script>
	
	const params = new URLSearchParams(window.location.search);
	
	//dataset = datasets[params.get("ds")];
	ds = params.get("ds").split('-');
	planet = params.get("planet");
	satellogic = params.get("satellogic");
	
	latlon = window.location.hash.split('#')[1].split('/');
	console.log(Number(latlon[0]),Number(latlon[2]), Number(latlon[1]));
	
	pid = ds[1] + "-" + ds[2] + "-" + ds[3];
    root = 'https://kgbbmarmdgv53gdb47pls2v2oe0qotcs.lambda-url.eu-central-1.on.aws/cog/tiles/WebMercatorQuad'
    root += '/{z}/{x}/{y}@2x?url=s3://s2dr3-output-prod/' + ds[0] + '/' + ds[1] + '/' + pid;
	
	mapStyle1 = {
	    version: 8,
	    sources: {
	        s2: {
	          	"type": 'raster',
			  	"tiles": [
					root + "/S2L2A_" + pid + "_TCI.tif"
				],
	          	"tileSize": 256,
	        },
	        s2ndvi: {
	          	"type": 'raster',
			  	"tiles": [
					root + "/S2L2A_" + pid + "_NDVI.tif"
				],
	          	"tileSize": 256,
	        },
	        s2irp: {
	          	"type": 'raster',
			  	"tiles": [
					root + "/S2L2A_" + pid + "_IRP.tif"
				],
	          	"tileSize": 256,
	        }
	    },
	    "layers": [
	        {
	            "id": 'S2 RGB',
	            "source": 's2',
	            "type": 'raster',
	            "minzoom": 0,
	            "maxzoom": 19,
				"paint": {
				          'raster-resampling': 'nearest'
				        }
	        },
			{
	            "id": 'S2 NDVI',
	            "source": 's2ndvi',
	            "type": 'raster',
	            "minzoom": 0,
	            "maxzoom": 19
	        },
	        {
	            "id": 'S2 B11,B8,B5',
	            "source": 's2irp',
	            "type": 'raster',
	            "minzoom": 0,
	            "maxzoom": 19
	        }
	    ]
	}
		
	mapStyle2 = {
	    "version": 8,
	    "sources": {
	        "s2dr3": {
	          "type": 'raster',
			  "tiles": [
				root + "/S2L2Ax10_" + pid + "_TCI.tif"
			  ],
	          "tileSize": 256
	        },
	        "s2dr3ndvi": {
	          "type": 'raster',
			  "tiles": [
				root + "/S2L2Ax10_" + pid + "_NDVI.tif"
			  ],
	          "tileSize": 256
	        },
	        "s2dr3irp": {
	          "type": 'raster',
			  "tiles": [
				root + "/S2L2Ax10_" + pid + "_IRP.tif"
			  ],
	          "tileSize": 256
	        }
	    },
	    "layers": [
	        {
	            "id": 'S2 RGB',
	            "source": 's2dr3',
	            "type": 'raster',
	            "minzoom": 0,
	            "maxzoom": 19,
	        },
	        {
	            "id": 'S2 NDVI',
	            "source": 's2dr3ndvi',
	            "type": 'raster',
	            "minzoom": 0,
	            "maxzoom": 19
	        },
	        {
	            "id": 'S2 B11,B8,B5',
	            "source": 's2dr3irp',
	            "type": 'raster',
	            "minzoom": 0,
	            "maxzoom": 19
	        }
	    ]
	}

	//mapboxgl.accessToken = 'pk.eyJ1IjoidmFyaWsiLCJhIjoiTC1IZFkzNCJ9.Bh1S9ujLfb9hW6GlunR2eA';
  	mapboxgl.accessToken =
    "pk.eyJ1IjoiZ2lyaXNocGFsbGFnYXR0aSIsImEiOiJja2h6NGVuc20wYndjMnlxaDExbzlsa3B2In0.e94ZfcoPleAA2nqjeX10ag";

	var center = [Number(latlon[2]), Number(latlon[1])] //dataset['center']
	var z = Number(latlon[0])
	
	var beforeMap = new mapboxgl.Map({
	    container: 'before',
	    hash: true,
	    style: mapStyle1,
	    center: center,
	    maxZoom: 18,
	    zoom: z,
		//attributionControl: false
	});
	
	//beforeMap.addControl(new mapboxgl.AttributionControl(), 'bottom-left');
	
	var afterMap = new mapboxgl.Map({
	    container: 'after',
		//hash: true,
	    style: mapStyle2,
	    center: center,
	    maxZoom: 18,
	    zoom: z
	});

	// A selector or reference to HTML element
	var container = '#comparison-container';

	var map = new mapboxgl.Compare(beforeMap, afterMap, container, {
	    // Set this to enable comparing two maps by mouse movement:
	    // mousemove: true
	});

	// Keep the loader up until both sides have settled. This checks the tile
	// state directly because 'idle' doesn't fire after a 404, which is what
	// tiles outside a dataset return when someone pans past its edge.
	const loader = document.getElementById('loader');
	const maps = [beforeMap, afterMap];
	let loaderTimer = null;
	const hideLoaderWhenDone = () => {
		if (maps.every((m) => m.loaded() && m.areTilesLoaded())) {
			loader.classList.remove('visible');
			clearInterval(loaderTimer);
			loaderTimer = null;
		}
	};
	const showLoader = () => {
		loader.classList.add('visible');
		if (loaderTimer === null) {
			loaderTimer = setInterval(hideLoaderWhenDone, 250);
		}
	};
	maps.forEach((m) => m.on('dataloading', showLoader));
	showLoader();

	// Show the cursor position as decimal lat, lon in the footer, and copy
	// it to the clipboard on right-click. Both maps share the same view, so
	// either side of the slider reports the same position.
	const coords = document.getElementById('coords');
	const formatLatLon = (lngLat) => lngLat.lat.toFixed(6) + ', ' + lngLat.lng.toFixed(6);
	let copiedTimer = null;

	// Fallback for plain http, local files, or browsers that block the Clipboard API
	const copyWithTextarea = (text) => {
		const field = document.createElement('textarea');
		field.value = text;
		field.style.position = 'fixed';
		field.style.opacity = '0';
		document.body.appendChild(field);
		field.select();
		const ok = document.execCommand('copy');
		document.body.removeChild(field);
		return ok ? Promise.resolve() : Promise.reject(new Error('copy failed'));
	};
	const copyText = (text) => {
		if (navigator.clipboard && window.isSecureContext) {
			return navigator.clipboard.writeText(text).catch(() => copyWithTextarea(text));
		}
		return copyWithTextarea(text);
	};

	maps.forEach((m) => {
		m.on('mousemove', (e) => {
			if (copiedTimer === null) {
				coords.textContent = formatLatLon(e.lngLat);
			}
		});
		m.on('contextmenu', (e) => {
			e.preventDefault();
			const text = formatLatLon(e.lngLat);
			copyText(text).then(() => {
				coords.textContent = 'Copied ' + text;
				coords.classList.add('copied');
			}).catch(() => {
				coords.textContent = 'Could not copy ' + text;
			}).finally(() => {
				clearTimeout(copiedTimer);
				copiedTimer = setTimeout(() => {
					coords.classList.remove('copied');
					coords.textContent = text;
					copiedTimer = null;
				}, 1500);
			});
		});
	});
	document.getElementById('comparison-container').addEventListener('mouseleave', () => {
		if (copiedTimer === null) {
			coords.textContent = '';
		}
	});
	
	// After the last frame rendered before the map enters an "idle" state.
	
	beforeMap.on('load', () => {
		
		// If these two layers were not added to the map, abort
		if (!beforeMap.getLayer('S2 RGB')) { //} || !beforeMap.getLayer('Mapbox') || !beforeMap.getLayer('ESRI')) {
			return;
		}
		
		toggleableLayerIds = ['S2 RGB','S2 NDVI','S2 B11,B8,B5']
		attribution = "© ESA "
		attribution += "| © Gamma Earth"
		
		document.getElementById("attribution").textContent = attribution;
 
		// Set up the corresponding toggle button for each layer.
		for (const id of toggleableLayerIds) {
			// Skip layers that already have a button set up.
			if (document.getElementById(id)) {
				continue;
			}
 
			// Create a link.
			const link = document.createElement('a');
			link.id = id;
			link.href = '#';
			link.textContent = id;
			link.className = '';
 
				// Show or hide layer when the toggle is clicked.
			link.onclick = function (e) {
				const clickedLayer = this.textContent;
				//if (clickedLayer != 'ESRI') {
					

				e.preventDefault();
				e.stopPropagation();
				
				for (const pid of toggleableLayerIds) {
					
					if (pid == clickedLayer) {
						beforeMap.setLayoutProperty(pid, 'visibility', 'visible');
						afterMap.setLayoutProperty(pid, 'visibility', 'visible');
						document.getElementById(pid).className = 'active';
					} else {
						beforeMap.setLayoutProperty(pid, 'visibility', 'none');
						afterMap.setLayoutProperty(pid, 'visibility', 'none');
						document.getElementById(pid).className = '';
					}
					
				}
			};

			const layers = document.getElementById('menu');
			layers.appendChild(link);
			
			beforeMap.setLayoutProperty(id, 'visibility', 'none');
			afterMap.setLayoutProperty(id, 'visibility', 'none');
			document.getElementById(id).className = '';
		
		}
	
		
		beforeMap.setLayoutProperty('S2 RGB', 'visibility', 'visible');
		afterMap.setLayoutProperty('S2 RGB', 'visibility', 'visible');
		document.getElementById('S2 RGB').className = 'active';
		
		// Create a link.
		id = 'S2DR3'
		const link = document.createElement('a');
		link.id = id;
		link.href = '#';
		link.textContent = id;
		link.className = 'active';
		const layerR = document.getElementById('menuR');
		layerR.appendChild(link);
			//}
	});
	
</script>
