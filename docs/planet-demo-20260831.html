
<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <title>Planet SDSR Demo</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v2.10.0/mapbox-gl.js'></script>
    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v2.10.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        body { margin:0; padding:0; background: #111!important; }
    </style>
</head>
<body>

<style>
    body {
        overflow: hidden;
    }

    body * {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }

    .map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
    }
	
	.mapbox-attribution-container {
		bottom: 0;
		right: 0;
		position: absolute;
		display: block;
		margin: 0;
		padding: 0 5px;
		font-family: 'Helvetica Neue', Arial, Helvetica, sans-serif;
		font-size: 12px;
		line-height: 20px;
		font-weight: normal;
		-webkit-tap-highlight-color: rgba(0,0,0,0);
		background-color: rgba(255, 255, 255, 0.5);
		color: rgba(0, 0, 0, 0.75);
	}
	
	.menu {
		background: #fff;
		position: absolute;
		/* mapbox-gl-compare's slider is also z-index 1, and the plugin appends it to
		   #comparison-container, which follows both navs in the DOM — so on a tie it painted
		   over the buttons. 2 keeps the panels above the slider and its drag handle. */
		z-index: 2;
		top: 10px;
		border-radius: 3px;
		width: 120px;
		border: 1px solid rgba(0, 0, 0, 0.4);
		font-family: 'Open Sans', sans-serif;
	}
	
	#menu {
		left: 10px;
	}
	
	#menuR {
		right: 10px;
	}
 
	.menu a {
		font-size: 13px;
		color: #404040;
		display: block;
		margin: 0;
		padding: 0;
		padding: 10px;
		text-decoration: none;
		border-bottom: 1px solid rgba(0, 0, 0, 0.25);
		text-align: center;
	}
 
	.menu a:last-child {
		border: none;
	}
 
	.menu a:hover {
		background-color: #f8f8f8;
		color: #404040;
	}
 
	.menu a.active {
		background-color: #3887be;
		color: #ffffff;
	}
 
	.menu a.active:hover {
		background: #3074a4;
	}

	/* The legend sits after the last link, so :last-child no longer matches it. Drop the
	   trailing border here instead, and let the legend supply the separator when shown. */
	.menu a:last-of-type {
		border-bottom: none;
	}

	/* Confidence legend: hidden until the Confidence layer is toggled on. */
	#conf-legend {
		display: none;
		padding: 10px;
		font-family: 'Open Sans', sans-serif;
		font-size: 11px;
		color: #404040;
	}

	#conf-legend.visible {
		display: block;
		border-top: 1px solid rgba(0, 0, 0, 0.25);
	}

	.conf-legend-head {
		display: flex;
		justify-content: space-between;
		font-size: 9px;
		letter-spacing: 0.03em;
		color: #8a8a8a;
		padding-bottom: 3px;
		margin-bottom: 5px;
		border-bottom: 1px solid rgba(0, 0, 0, 0.15);
	}

	.conf-legend-row {
		display: flex;
		align-items: center;
		justify-content: space-between;
		margin-bottom: 3px;
	}

	.conf-legend-row:last-child {
		margin-bottom: 0;
	}

	/* Swatch colour is injected per row as --c. The two 45deg gradients under it are the
	   transparency checkerboard, so a fading swatch reads the same way it does on the map:
	   high confidence lets the SR image below the overlay show through. */
	.conf-legend-sw {
		width: 48px;
		height: 13px;
		border: 1px solid rgba(0, 0, 0, 0.3);
		border-radius: 2px;
		background-image:
			linear-gradient(var(--c), var(--c)),
			linear-gradient(45deg, rgba(0,0,0,0.13) 25%, transparent 25%,
				transparent 75%, rgba(0,0,0,0.13) 75%),
			linear-gradient(45deg, rgba(0,0,0,0.13) 25%, #fff 25%,
				#fff 75%, rgba(0,0,0,0.13) 75%);
		background-size: 100% 100%, 8px 8px, 8px 8px;
		background-position: 0 0, 0 0, 4px 4px;
	}

	.conf-legend-lb {
		font-variant-numeric: tabular-nums;
		line-height: 1;
	}

</style>

<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-compare/v0.4.0/mapbox-gl-compare.js"></script>
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-compare/v0.4.0/mapbox-gl-compare.css" type="text/css"/>

<nav id="menu" class="menu"></nav>
<nav id="menuR" class="menu"></nav>
<div id="comparison-container">
    <div id="before" class="map"></div>
    <div id="after" class="map"></div>
</div>
<div id="attribution" class="mapbox-attribution-container"></div>

<!--<script src='s2dr2datasets11.js'></script>-->
<script>
	
	const params = new URLSearchParams(window.location.search);

	// Layers live one directory per scene:
	//   s3://<bucket>/<prefix>/<batch>/<ds><suffix>/<layer>.tif
	// e.g. s3://planet-serving-345370630617-eu-central-1-an/PSDSR-scene-inference/
	//        batch_center2000_20260828/20221019_034506_83_2479_3B_AnalyticMS_TOAR_8b/sr_rgb8.tif
	// Every part is overridable from the query string; the defaults point at the
	// batch_center2000_20260828 run, so in practice only ?ds= needs to be given:
	//   planet-demo-20260831.html?ds=20221019_034506_83_2479#16.76/8.103351/9.280767
	const bucket = params.get('bucket') || 'planet-serving-345370630617-eu-central-1-an';
	const prefix = params.get('prefix') !== null ? params.get('prefix') : 'PSDSR-scene-inference';
	const batch  = params.get('batch')  !== null ? params.get('batch')  : 'batch_center2000_20260828';
	// The Planet product suffix is stable across a batch, so ?ds= carries only the scene stem.
	// A ds that already includes the suffix is passed through unchanged.
	const suffix = params.get('suffix') !== null ? params.get('suffix') : '_3B_AnalyticMS_TOAR_8b';
	const ds     = params.get('ds') || '20221019_034506_83_2479';
	const scene  = ds.endsWith(suffix) ? ds : ds + suffix;

	// filter(Boolean) lets ?prefix=&batch= flatten the path for scenes stored at the bucket root.
	const sceneDir = [bucket, prefix, batch, scene].filter(Boolean).join('/');

	// Layer filenames inside the scene directory. The NDVI and TCI products are written
	// pre-colorized as 3-band uint8 RGB, same as the *_rgb8 files, so they take the identical
	// render params. *_rgb8 is the TOAR reflectance composite; *_tci8 is the true-colour image.
	const lqName     = params.get('lq')     || 'lq_rgb8';
	const srName     = params.get('sr')     || 'sr_rgb8';
	const lqTciName  = params.get('lqtci')  || 'lq_tci8';
	const srTciName  = params.get('srtci')  || 'sr_tci8';
	const lqNdviName = params.get('lqndvi') || 'lq_ndvi';
	const srNdviName = params.get('srndvi') || 'sr_ndvi';
	const confName   = params.get('conf')   || 'conf_overlay';

	// Zoom the demo opens at when it has to generate its own view rather than read one from
	// the hash. mapbox-gl writes this straight back out as the #z/lat/lon it puts in the URL.
	const DEFAULT_ZOOM = 16;

	// #z/lat/lon, matching mapbox-gl's own hash format.
	const latlon = (window.location.hash || '').replace('#', '').split('/');
	const hasHash = latlon.length > 2 && latlon.every(function (v) { return v !== '' && isFinite(v); });
	const z   = hasHash ? Number(latlon[0]) : DEFAULT_ZOOM;
	const lat = hasHash ? Number(latlon[1]) : 8.103351;
	const lon = hasHash ? Number(latlon[2]) : 9.280767;

	tileBase = params.get('tiler')
		|| 'https://kgbbmarmdgv53gdb47pls2v2oe0qotcs.lambda-url.eu-central-1.on.aws/cog/tiles/WebMercatorQuad'
	root = tileBase + '/{z}/{x}/{y}@2x?url=s3://' + sceneDir + '/';
	// resampling/reproject pin nearest-neighbour server-side. TiTiler 0.18.5 already defaults
	// both to nearest, so this is belt-and-braces against a future default change; the visible
	// smoothing comes from Mapbox's raster-resampling paint property, set on each layer below.
	nn = '&resampling=nearest&reproject=nearest'
    tif = '.tif&render=rgb' + nn + '&disable_cache=true'

	// Confidence overlay is a 4-channel RGBA COG. Band 4 is tagged ColorInterp.alpha, so by
	// default rio-tiler pulls it out as a boolean dataset mask and the PNG alpha collapses to
	// 0/255. Requesting it as a fourth *data* band with return_mask=false keeps it continuous.
	// The .png extension is required: with return_mask=false the mask is all-valid, so the
	// server's format auto-selection would otherwise hand back JPEG, which has no alpha at all.
	confRoot = tileBase + '/{z}/{x}/{y}@2x.png?url=s3://' + sceneDir + '/';
	// No rescale: band 4 already carries the spec'd alpha, 255 * (1 - confidence/100), so a
	// mostly-transparent overlay is the correct result — it means the SR output is mostly
	// high-confidence. Stretching it would overstate low confidence.
	confTif = '.tif&bidx=1&bidx=2&bidx=3&bidx=4&return_mask=false'
	        + nn + '&disable_cache=true'

	const lqTiles     = root + lqName + tif;
	const srTiles     = root + srName + tif;
	const lqTciTiles  = root + lqTciName + tif;
	const srTciTiles  = root + srTciName + tif;
	const lqNdviTiles = root + lqNdviName + tif;
	const srNdviTiles = root + srNdviName + tif;
	const confTiles   = confRoot + confName + confTif;
	console.log('scene s3://' + sceneDir, { lq: lqTiles, sr: srTiles,
		lqTci: lqTciTiles, srTci: srTciTiles,
		lqNdvi: lqNdviTiles, srNdvi: srNdviTiles, conf: confTiles })
	
	mapStyle1 = {
	    version: 8,
	    sources: {
	        s2: {
	          	"type": 'raster',
			  	"tiles": [
					lqTiles
				],
	          	"tileSize": 256,
	        },
	        s2tci: {
	          	"type": 'raster',
			  	"tiles": [
					lqTciTiles
				],
	          	"tileSize": 256,
	        },
	        s2ndvi: {
	          	"type": 'raster',
			  	"tiles": [
					lqNdviTiles
				],
	          	"tileSize": 256,
	        },
	        sdconf: {
	          	"type": 'raster',
			  	"tiles": [
					confTiles
				],
	          	"tileSize": 256,
	        }
	    },
	    "layers": [
	        {
	            "id": 'SD TOAR',
	            "source": 's2',
	            "type": 'raster',
	            "minzoom": 0,
	            "maxzoom": 19,
				"paint": {
				          'raster-resampling': 'nearest'
				        }
	        },
			{
	            "id": 'SD TCI',
	            "source": 's2tci',
	            "type": 'raster',
	            "minzoom": 0,
	            "maxzoom": 19,
				"paint": {
					'raster-resampling': 'nearest'
				}
	        },
			{
	            "id": 'SD NDVI',
	            "source": 's2ndvi',
	            "type": 'raster',
	            "minzoom": 0,
	            "maxzoom": 19,
				"paint": {
					'raster-resampling': 'nearest'
				}
	        },
			// Drawn last so it sits on top of the LQ layers. Hidden until toggled.
	        {
	            "id": 'Confidence',
	            "source": 'sdconf',
	            "type": 'raster',
	            "minzoom": 0,
	            "maxzoom": 19,
				"layout": {
					"visibility": 'none'
				},
				"paint": {
					'raster-resampling': 'nearest'
				}
	        }
	    ]
	}
		
	mapStyle2 = {
	    "version": 8,
	    "sources": {
	        "s2dr3": {
	          "type": 'raster',
			  "tiles": [
				srTiles
			  ],
	          "tileSize": 256
	        },
	        "s2dr3tci": {
	          "type": 'raster',
			  "tiles": [
				srTciTiles
			  ],
	          "tileSize": 256
	        },
	        "s2dr3ndvi": {
	          "type": 'raster',
			  "tiles": [
				srNdviTiles
			  ],
	          "tileSize": 256
	        }
	    },
	    "layers": [
	        {
	            "id": 'SD TOAR',
	            "source": 's2dr3',
	            "type": 'raster',
	            "minzoom": 0,
	            "maxzoom": 19,
				"paint": {
					'raster-resampling': 'nearest'
				}
	        },
	        {
	            "id": 'SD TCI',
	            "source": 's2dr3tci',
	            "type": 'raster',
	            "minzoom": 0,
	            "maxzoom": 19,
				"paint": {
					'raster-resampling': 'nearest'
				}
	        },
	        {
	            "id": 'SD NDVI',
	            "source": 's2dr3ndvi',
	            "type": 'raster',
	            "minzoom": 0,
	            "maxzoom": 19,
				"paint": {
					'raster-resampling': 'nearest'
				}
	        }
	    ]
	}

	//mapboxgl.accessToken = 'pk.eyJ1IjoidmFyaWsiLCJhIjoiTC1IZFkzNCJ9.Bh1S9ujLfb9hW6GlunR2eA';
  	mapboxgl.accessToken =
    "pk.eyJ1IjoiZ2lyaXNocGFsbGFnYXR0aSIsImEiOiJja2h6NGVuc20wYndjMnlxaDExbzlsa3B2In0.e94ZfcoPleAA2nqjeX10ag";

	var center = [lon, lat]
	
	var beforeMap = new mapboxgl.Map({
	    container: 'before',
	    hash: true,
	    style: mapStyle1,
	    center: center,
	    maxZoom: 18,
	    zoom: z,
		//attributionControl: false
	});
	
	//beforeMap.addControl(new mapboxgl.AttributionControl(), 'bottom-left');
	
	var afterMap = new mapboxgl.Map({
	    container: 'after',
		//hash: true,
	    style: mapStyle2,
	    center: center,
	    maxZoom: 18,
	    zoom: z
	});

	// A selector or reference to HTML element
	var container = '#comparison-container';

	var map = new mapboxgl.Compare(beforeMap, afterMap, container, {
	    // Set this to enable comparing two maps by mouse movement:
	    // mousemove: true
	});

	// Without a hash the demo has no idea where the scene sits, and the static fallback above
	// only matches one scene. Ask the tiler for the COG's bounds and jump to their centre.
	// Deliberately not fitBounds: that picks whatever zoom frames the whole scene (~13 for a
	// 6k px tile), which is too far out to judge SR detail. Moving beforeMap is enough —
	// Compare keeps afterMap in sync. Failure is non-fatal: the map stays on the fallback view.
	if (!hasHash) {
		const infoUrl = tileBase.replace('/tiles/WebMercatorQuad', '/info')
			+ '?url=s3://' + sceneDir + '/' + srName + '.tif';
		fetch(infoUrl)
			.then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
			.then(function (info) {
				const b = info.bounds;
				beforeMap.jumpTo({
					center: [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2],
					zoom: DEFAULT_ZOOM
				});
			})
			.catch(function (e) { console.warn('scene bounds unavailable', e); });
	}
	
	// After the last frame rendered before the map enters an "idle" state.
	
	beforeMap.on('load', () => {
		
		// If these two layers were not added to the map, abort
		if (!beforeMap.getLayer('SD TOAR')) { //} || !beforeMap.getLayer('Mapbox') || !beforeMap.getLayer('ESRI')) {
			return;
		}
		
		toggleableLayerIds = ['SD TOAR','SD TCI','SD NDVI']
		attribution = "© Planet Labs PBC "
		attribution += "| © Gamma Earth"
		
		document.getElementById("attribution").textContent = attribution;
 
		// Set up the corresponding toggle button for each layer.
		for (const id of toggleableLayerIds) {
			// Skip layers that already have a button set up.
			if (document.getElementById(id)) {
				continue;
			}
 
			// Create a link.
			const link = document.createElement('a');
			link.id = id;
			link.href = '#';
			link.textContent = id;
			link.className = '';
 
				// Show or hide layer when the toggle is clicked.
			link.onclick = function (e) {
				const clickedLayer = this.textContent;
				//if (clickedLayer != 'ESRI') {
					

				e.preventDefault();
				e.stopPropagation();
				
				for (const pid of toggleableLayerIds) {
					
					if (pid == clickedLayer) {
						beforeMap.setLayoutProperty(pid, 'visibility', 'visible');
						afterMap.setLayoutProperty(pid, 'visibility', 'visible');
						document.getElementById(pid).className = 'active';
					} else {
						beforeMap.setLayoutProperty(pid, 'visibility', 'none');
						afterMap.setLayoutProperty(pid, 'visibility', 'none');
						document.getElementById(pid).className = '';
					}
					
				}
			};

			const layers = document.getElementById('menu');
			layers.appendChild(link);
			
			beforeMap.setLayoutProperty(id, 'visibility', 'none');
			afterMap.setLayoutProperty(id, 'visibility', 'none');
			document.getElementById(id).className = '';
		
		}
	
		
		beforeMap.setLayoutProperty('SD TOAR', 'visibility', 'visible');
		afterMap.setLayoutProperty('SD TOAR', 'visibility', 'visible');
		document.getElementById('SD TOAR').className = 'active';
		
		// Create a link.
		id = 'SRSD'
		const link = document.createElement('a');
		link.id = id;
		link.href = '#';
		link.textContent = id;
		link.className = 'active';
		const layerR = document.getElementById('menuR');
		layerR.appendChild(link);

		// Confidence overlay: independent on/off toggle. The button lives in the right panel,
		// but the overlay itself is drawn over the LQ layers on beforeMap.
		const confLink = document.createElement('a');
		confLink.id = 'Confidence';
		confLink.href = '#';
		confLink.textContent = 'Confidence';
		confLink.className = '';

		// render_confidence_overlay() sampled every 10%: [label, r, g, b, a]. Hue is matplotlib
		// Spectral, alpha is 255 * (1 - confidence/100). Ordered 0 -> 100 top to bottom, matching
		// the reference legend. Regenerate these rows if the overlay's colormap changes.
		const CONF_STOPS = [
			[  0, 158,   1,  66, 255],
			[ 10, 213,  62,  79, 230],
			[ 20, 244, 109,  67, 204],
			[ 30, 253, 174,  97, 179],
			[ 40, 254, 224, 139, 153],
			[ 50, 255, 255, 191, 128],
			[ 60, 230, 245, 152, 102],
			[ 70, 171, 221, 164,  77],
			[ 80, 102, 194, 165,  51],
			[ 90,  50, 136, 189,  26],
			[100,  94,  79, 162,   0]
		];

		// Swatch/label legend, shown under the toggle only while the layer is on.
		const confLegend = document.createElement('div');
		confLegend.id = 'conf-legend';
		confLegend.innerHTML =
			'<div class="conf-legend-head"><span>Color</span><span>%</span></div>'
			+ CONF_STOPS.map(function (s) {
				const rgba = 'rgba(' + s[1] + ',' + s[2] + ',' + s[3] + ',' + (s[4] / 255).toFixed(3) + ')';
				return '<div class="conf-legend-row">'
					+ '<span class="conf-legend-sw" style="--c:' + rgba + '"></span>'
					+ '<span class="conf-legend-lb">' + s[0] + '</span>'
					+ '</div>';
			}).join('');

		confLink.onclick = function (e) {
			e.preventDefault();
			e.stopPropagation();

			const visible = beforeMap.getLayoutProperty('Confidence', 'visibility') === 'visible';
			beforeMap.setLayoutProperty('Confidence', 'visibility', visible ? 'none' : 'visible');
			this.className = visible ? '' : 'active';
			confLegend.className = visible ? '' : 'visible';
		};

		layerR.appendChild(confLink);
		layerR.appendChild(confLegend);
			//}
	});
	
</script>
