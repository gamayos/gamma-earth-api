	#menu {
		position: absolute;

		left: 20px;

		/*width: 100%;*/

	#menu a {

	}
	
</style>

<div id="menu"></div>
<div id="logo"><img src="ge_logo.png" style="height: 50px"></div>
<div id="demo-container"></div>

<script>
	datasets = {
		//"AU-T52JFS-20220210-u92157bc": { title: "AU/Uluru", center: [131.02749,-25.35108] },
		"US-T11SLT-20220304-ua3566d2": { title: "US/LA", center: [-118.2897,33.8153] },
		"BR-T22KGB-20200822-u950bf4f": { title: "BR/Bonfim", center: [-48.24921,-21.42953] },
		"BR-T22MHD-20210808-u6e95604": { title: "BR/Caraparu", center: [-48.1596,-1.3891] },
		"CH-T31TGM-20180801-u3a90160": { title: "CH/Geneva", center: [6.06273,46.213763] },
		"ES-T30SVH-20190812-uc28e47e": { title: "ES/Ubeda", center: [-3.24,37.9901] },
		"ES-T30TXK-20211104-ue3e1509": { title: "ES/Teruel", center: [-1.21463,40.41936] },
	}
	loaded = false;
	for (const ds of Object.keys(datasets)) {
		if (!ds.includes("__")) {
			//console.log(ds)
		
			// Create a link.
			const link = document.createElement('a');
			link.id = ds;
			link.href = '#';
			link.textContent = datasets[ds]['title'];
		
			if (!loaded) {
				params = ds + '#15/' + datasets[ds]['center'][1] + '/' + datasets[ds]['center'][0]
				$("#demo-container").append("<iframe src='s2dr4-demo-20260831.html?ds=" + params + "' />");
				link.className = 'active';
				loaded = true;
			} else {
				link.className = '';
			}
		
			link.onclick = function (e) {
			
				this.className = 'active';
				$("#demo-container").empty();
				params = this.id + '#15/' + datasets[this.id]['center'][1] + '/' + datasets[this.id]['center'][0]
				$("#demo-container").append("<iframe src='s2dr4-demo-20260831.html?ds=" + params + "' />");
			
				e.preventDefault();
				e.stopPropagation();
			
				for (const d of Object.keys(datasets)) {
					if (!d.includes("__") & d != this.id) {
						document.getElementById(d).className = '';
					}
				}
			};
		
			const menu = document.getElementById('menu');
			menu.appendChild(link);
		}
	}
	
</script>
